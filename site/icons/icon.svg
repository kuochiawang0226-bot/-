<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16324f"/>
      <stop offset=".55" stop-color="#0f2238"/>
      <stop offset="1" stop-color="#0a1626"/>
    </linearGradient>
    <radialGradient id="sun" cx=".86" cy=".1" r=".62">
      <stop offset="0" stop-color="#ffcf6e" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#f29b4b" stop-opacity=".18"/>
      <stop offset="1" stop-color="#f29b4b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealglow" cx=".05" cy="1" r=".7">
      <stop offset="0" stop-color="#2bb3a0" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2bb3a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="candle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a80"/>
      <stop offset="1" stop-color="#e2323f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f6a821"/>
      <stop offset=".6" stop-color="#ffd25e"/>
      <stop offset="1" stop-color="#fff1b8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- 背景：深夜藍＋右上日出暖光＋左下青綠光 -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#sun)"/>
  <rect width="1024" height="1024" fill="url(#tealglow)"/>

  <!-- 淡淡的看盤格線 -->
  <g stroke="#ffffff" stroke-opacity=".07" stroke-width="4">
    <line x1="170" y1="360" x2="854" y2="360"/>
    <line x1="170" y1="520" x2="854" y2="520"/>
    <line x1="170" y1="680" x2="854" y2="680"/>
  </g>

  <!-- 三根一路墊高的紅 K（台股紅色＝漲） -->
  <g filter="url(#soft)">
    <line x1="338" y1="560" x2="338" y2="772" stroke="#ff8a80" stroke-width="14" stroke-linecap="round"/>
    <rect x="288" y="600" width="100" height="148" rx="22" fill="url(#candle)"/>
    <line x1="512" y1="440" x2="512" y2="728" stroke="#ff8a80" stroke-width="14" stroke-linecap="round"/>
    <rect x="462" y="476" width="100" height="220" rx="22" fill="url(#candle)"/>
    <line x1="686" y1="300" x2="686" y2="660" stroke="#ff8a80" stroke-width="14" stroke-linecap="round"/>
    <rect x="636" y="336" width="100" height="292" rx="22" fill="url(#candle)"/>
  </g>

  <!-- 金色上升箭頭 -->
  <g filter="url(#glow)">
    <path d="M196 792 C 360 740, 470 640, 560 520 S 712 330, 790 262" fill="none" stroke="url(#gold)" stroke-width="44" stroke-linecap="round"/>
    <path d="M700 236 L 830 220 L 812 350 Z" fill="#fff1b8" stroke="#fff1b8" stroke-width="18" stroke-linejoin="round"/>
  </g>

  <!-- 箭頭尖端的閃光 -->
  <g transform="translate(846 168)" fill="#fff6d6">
    <path d="M0 -46 C 6 -12, 12 -6, 46 0 C 12 6, 6 12, 0 46 C -6 12, -12 6, -46 0 C -12 -6, -6 -12, 0 -46 Z"/>
  </g>
</svg>
