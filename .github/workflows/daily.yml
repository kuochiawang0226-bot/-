# 每日資料：抓官方資料 → 選股與風控 → 更新網站資料 → 發布網站
# 台灣時間 07:20（開盤前）與 17:40（收盤資料齊全後）各跑一次。
# 小檔案（報告、總表、記分）存回 main；上千個個股詳細檔推到 data 分支（只保留最新一版，存放庫不會越來越肥）。
name: daily

on:
  schedule:
    - cron: "20 23 * * 0-4"   # 台灣 週一~五 07:20
    - cron: "40 9 * * 1-5"    # 台灣 週一~五 17:40
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TZ: Asia/Taipei
      STOCK_PASSWORD: ${{ secrets.STOCK_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 快取官方資料（同日重跑不再打證交所）
        uses: actions/cache@v4
        with:
          path: .cache
          key: twse-${{ github.run_id }}
          restore-keys: twse-
      - name: 產生每日資料
        run: python -m engine.run_daily
      - name: 盤中報價與新聞初始化
        run: python -m engine.run_live || true
      - name: 存回 main（小檔案）
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add site/data/report.json site/data/stocks.json site/data/live.json data/scorecard data/daily 2>/dev/null || true
          git add site/data/private.enc.json site/data/live_private.enc.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "每日資料 $(date +%F_%H%M)"
          git pull --rebase -X ours || true
          git push
      - name: 個股詳細檔推到 data 分支（只留最新一版）
        run: |
          rm -rf /tmp/databr && mkdir -p /tmp/databr/stock
          cp -r site/data/stock/. /tmp/databr/stock/
          cd /tmp/databr
          git init -q -b data
          git -c user.name=stock-bot -c user.email=stock-bot@users.noreply.github.com add -A
          git -c user.name=stock-bot -c user.email=stock-bot@users.noreply.github.com commit -qm "個股詳細資料 $(date +%F_%H%M)"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
      - name: 組網站
        run: python -m engine.build_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
