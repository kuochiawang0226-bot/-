# 每日晨報：抓資料 → 選股與風控 → 更新網站資料 → 推 LINE
# 早上 07:20（台灣）跑一次並推 LINE；下午 17:40 收盤資料齊了再跑一次（只更新網站，不推）。
name: daily

on:
  schedule:
    - cron: "20 23 * * 0-4"   # 台灣 週一~五 07:20
    - cron: "40 9 * * 1-5"    # 台灣 週一~五 17:40
  workflow_dispatch:
    inputs:
      push_line:
        description: "要推播 LINE 嗎？(true/false)"
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Taipei
      STOCK_PASSWORD: ${{ secrets.STOCK_PASSWORD }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 快取官方資料（同日重跑不再打證交所）
        uses: actions/cache@v4
        with:
          path: .cache
          key: twse-${{ github.run_id }}
          restore-keys: twse-
      - name: 產生晨報
        run: |
          if [ "${{ github.event.schedule }}" = "20 23 * * 0-4" ] || [ "${{ inputs.push_line }}" = "true" ]; then
            python -m engine.run_daily --push
          else
            python -m engine.run_daily
          fi
      - name: 盤中報價初始化
        run: python -m engine.run_live || true
      - name: 存回存放庫
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add -A site/data/stock site/data/report.json site/data/stocks.json site/data/live.json data/scorecard data/daily data/line_state.json 2>/dev/null || true
          git add site/data/private.enc.json site/data/live_private.enc.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "晨報資料 $(date +%F_%H%M)"
          git pull --rebase -X ours || true
          git push
      - name: 組網站
        run: python -m engine.build_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true   # 還沒開 GitHub Pages 時不算失敗
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
