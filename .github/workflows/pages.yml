# 網站發布：main 有新提交（程式或資料更新）就把 site/ 組好發布到 GitHub Pages。
# 不抓任何資料、不需要任何密碼；資料由 daily／live 排程產生。
# 依 GitHub 官方範本分成「組網站」與「發布」兩個工作，避免發布時找不到剛上傳的網站檔。
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "engine/build_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # 依序發布，最新版本一定會上線

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m engine.build_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
