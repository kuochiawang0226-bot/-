# 盤中：更新報價、當沖即時判斷與新聞；非交易時段只更新新聞。只更新網站，不寫回存放庫。
# 建議由 cron-job.org 觸發：盤中每 5 分鐘、其他時間每 15 分鐘。一次約 2 分鐘跑完，不要設每分鐘（會互相排隊）。
name: live

on:
  schedule:
    - cron: "*/5 1-5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Asia/Taipei
      STOCK_PASSWORD: ${{ secrets.STOCK_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: 取得個股詳細檔（data 分支）
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: databranch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 盤中報價＋當沖即時判斷＋新聞
        run: python -m engine.run_live
      - run: python -m engine.build_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: quotes
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
