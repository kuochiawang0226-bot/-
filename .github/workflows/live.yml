# 盤中（台灣 09:00~13:30）每 10 分鐘：更新報價與當沖即時判斷，只更新網站，不推 LINE。
# 不寫回存放庫（避免大量提交）；還沒開 GitHub Pages 時部署步驟會略過不算失敗。
name: live

on:
  schedule:
    - cron: "*/10 1-5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: live
  cancel-in-progress: true

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Asia/Taipei
      STOCK_PASSWORD: ${{ secrets.STOCK_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 盤中報價＋當沖即時判斷
        run: python -m engine.run_live
      - run: python -m engine.build_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        continue-on-error: true
